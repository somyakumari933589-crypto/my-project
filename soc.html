<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SOC Copilot Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 5px;
        }
        pre {
            margin: 0;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ AI SOC Copilot - घटना विश्लेषण (Dashboard)</h1>
    
    <form id="eventForm">
        <div class="form-group">
            <label for="source_ip">Source IP (हमलावर या सिस्टम की आईपी)</label>
            <input type="text" id="source_ip" value="192.168.1.50" required>
        </div>

        <div class="form-group">
            <label for="event_type">Event Type (साइबर हमले या घटना का प्रकार)</label>
            <input type="text" id="event_type" value="Brute Force Login" required>
        </div>

        <div class="form-group">
            <label for="message">Message (लॉग या सुरक्षा चेतावनी संदेश)</label>
            <input type="text" id="message" value="Multiple failed password attempts detected" required>
        </div>

        <div class="form-group">
            <label for="severity">Severity (खतरे की गंभीरता)</label>
            <select id="severity">
                <option value="low">Low (कम खतरा)</option>
                <option value="medium" selected>Medium (मध्यम खतरा)</option>
                <option value="high">High (गंभीर खतरा)</option>
            </select>
        </div>

        <button type="submit">घटना का विश्लेषण करें (Analyze Event)</button>
    </form>

    <div class="result-box" id="resultBox">
        <div class="result-title">पाइथन सर्वर से मिला रिस्पॉन्स (Response):</div>
        <pre id="resultOutput"></pre>
    </div>
</div>

<script>
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // फॉर्म इनपुट से डेटा निकालना
        const source_ip = document.getElementById('source_ip').value;
        const event_type = document.getElementById('event_type').value;
        const message = document.getElementById('message').value;
        const severity = document.getElementById('severity').value;
        const currentTimestamp = new Date().toISOString();

        // आपके FastAPI के Pydantic मॉडल (SecurityEvent) के मुताबिक डेटा तैयार करना
        const payload = {
            events: [
                {
                    timestamp: currentTimestamp,
                    source_ip: source_ip,
                    destination_ip: null,
                    username: null,
                    event_type: event_type,
                    message: message,
                    severity: severity
                }
            ]
        };

        const resultBox = document.getElementById('resultBox');
        const resultOutput = document.getElementById('resultOutput');

        try {
            // आपके FastAPI /analyze एंडपॉइंट पर डेटा भेजना
            const response = await fetch('http://127.0.0', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            // स्क्रीन पर सुंदर ढंग से रिजल्ट दिखाना
            resultBox.style.display = 'block';
            resultBox.style.borderLeftColor = '#38bdf8';
            resultOutput.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            // अगर पाइथन कोड बैकएंड में चालू नहीं है तो ये एरर दिखेगा
            resultBox.style.display = 'block';
            resultBox.style.borderLeftColor = '#ef4444';
            resultOutput.innerHTML = <span style="color: #ef4444;">त्रुटि: पाइथन सर्वर से कनेक्ट नहीं हो सका। कृपया टर्मिनल में <b>python soc.py</b> चलाकर बैकएंड को लाइव करें।</span>;
        }
    });
</script>

</body>
</html>
